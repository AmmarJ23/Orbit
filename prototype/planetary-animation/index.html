<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Orbit · Planetary study</title><link rel="stylesheet" href="/style.css"></head>
<body>
<canvas id="space" aria-label="Interactive low-poly planetary system. Drag to rotate the view."></canvas>
<header><div class="brand"><span class="mark">◌</span> Orbit <span class="tag">MOTION STUDY / 01</span></div><button id="fullscreen">Fullscreen ↗</button></header>
<section class="intro"><p class="eyebrow">A LITTLE SPACE TO THINK</p><h1>Your active universe.</h1><p>Low-poly worlds. A quieter kind of motion.</p></section>
<aside id="selection" hidden><span class="eyebrow">SELECTED WORLD</span><h2 id="planet-name"></h2><span id="planet-status" class="status" role="status"></span><p id="planet-description"></p><button id="enter-orbit" class="primary-action">Enter orbit ↗</button><p id="orbit-hint" class="orbit-hint"></p><button id="clear">Clear selection</button></aside>
<footer><div class="legend"><span><i class="comet"></i>Redmine orbit</span><span><i class="blue"></i>ClickUp orbit</span><span><i class="grey"></i>Not started</span></div><p>Drag to rotate · Click a planet</p></footer>
<details class="controls" open><summary>Motion & quality <span id="fps">— fps</span></summary><div class="control-body">
<label for="speed">Orbit speed <output id="speed-value">1×</output></label><input id="speed" type="range" min="0" max="3" step="0.1" value="1">
<div class="pair"><label>Frame limit<select id="frame-limit"><option value="30">30 fps</option><option value="60" selected>60 fps</option><option value="0">Uncapped</option></select></label><label>Resolution<select id="resolution"><option value="1">1×</option><option value="1.5" selected>1.5×</option><option value="2">2×</option></select></label></div>
<label class="check"><input id="stars" type="checkbox" checked> Star field</label><div class="actions"><button id="pause">Pause motion</button><button id="reset">Reset view</button></div><p id="stats"></p>
</div></details>
<div id="error" hidden></div><script type="module" src="/main.js"></script>
</body></html>
